name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VER: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux,   os: ubuntu-22.04 }   # 22.04: 较低 glibc, 兼容更多发行版
          - { platform: windows, os: windows-latest }
          - { platform: macos,   os: macos-latest }
          - { platform: android, os: ubuntu-22.04 }
          - { platform: ios,     os: macos-latest }
          - { platform: web,     os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # 与本地完全相同的入口: 产物在 build/<平台>/
      - run: scripts/build.sh ${{ matrix.platform }} "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: gomoku-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/Gomoku-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gomoku-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
