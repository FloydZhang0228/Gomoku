name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VER: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux,   os: ubuntu-22.04 }   # 22.04: 较低 glibc, 兼容更多发行版
          - { platform: windows, os: windows-latest }
          - { platform: macos,   os: macos-latest }
          - { platform: android, os: ubuntu-22.04 }
          - { platform: ios,     os: macos-latest }
          - { platform: web,     os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # 与本地完全相同的入口: 产物在 build/<平台>/
      - run: scripts/build.sh ${{ matrix.platform }} "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: gomoku-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/Gomoku-*
          if-no-files-found: error

  release:
    # 推送 main 或 v* 标签都发布; PR 只构建不发布
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gomoku-*
          merge-multiple: true
          path: dist

      # 校验六个平台产物齐全, 缺一个就不发布, 避免 Release 里少端
      - name: Verify artifacts
        run: |
          ls -lh dist
          for k in linux windows macos android ios web; do
            ls dist | grep -q -- "-$k" || { echo "缺少 $k 产物" >&2; exit 1; }
          done

      # 正式版: 推送 v* 标签 -> 以标签名创建 Release
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # 滚动版: 推送 main -> 更新固定的 "latest" 预发布, 产物覆盖为最新一次构建。
      # 文件名含 dev-<运行号>, 每次不同, 所以先删掉旧的 latest Release 和标签, 避免旧产物越积越多。
      - name: Remove previous rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建 (${{ github.sha }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            由 main 分支最新提交自动构建, 每次推送都会覆盖本 Release 的产物。
            提交: ${{ github.sha }}
            正式版本请看带版本号的 Release。
